[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shutilspy"
version = "0.1.0"
authors = [
    {name = "shlll", email = "shlll7347@gmail.com"}
]
requires-python = ">=3.7"
description = "common python utils"
dependencies = ["janus", "flask"]

[options.extras_require]
visualizer = ["flask"]

[tool.setuptools]
packages = ["shutils", "shutils.dag"]

[dependency-groups]
dev = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
shutilspy = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.build-dependencies]
rattler-build = ">=0.54.0,<0.55"
