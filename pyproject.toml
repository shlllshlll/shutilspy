[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shutilspy"
version = "0.1.1"
authors = [
    {name = "shlll", email = "shlll7347@gmail.com"}
]
requires-python = ">=3.13"
description = "Common Python utilities including DAG task framework, caching, rate limiting, RW locks, and parameter helpers"
readme = "README.md"
license = "MIT"
dependencies = []
keywords = ["concurrency", "dag", "caching", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]


[project.urls]
"Documentation" = "https://shlllshlll.github.io/shutilspy/"
"Repository" = "https://github.com/shlllshlll/shutilspy"
"Changelog" = "https://github.com/shlllshlll/shutilspy/releases"
[project.optional-dependencies]
visualizer = ["flask"]

[tool.setuptools]
packages = ["shutils", "shutils.dag", "shutils.dag.lib"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.12",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
test = "pytest --cov=shutils --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"

[tool.pixi.feature.dev.dependencies]
rattler-build = ">=0.54.0,<0.55"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF003"]

[tool.ruff.lint.per-file-ignores]
"shutils/imagesize.py" = ["N806", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["shutils"]

[tool.coverage.report]
fail_under = 70
