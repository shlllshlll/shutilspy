package:
  name: shutilspy
  version: 0.0.5

source:
  path: ..

build:
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python
    - setuptools
    - pip
    - janus
  run:
    - python
    - janus

about:
  license: MIT
  summary: 'common python utils'
